[project]
name = "batocera-battery-notifier"
version = '44.0'
requires-python = "==3.14.5"
dependencies = [
    'typing-extensions',
    'batocera-common',
]

[project.scripts]
batocera-battery-notifier = "batocera_battery_notifier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["/batocera_battery_notifier"]

[tool.pytest]
minversion = "9.0"
addopts = ["--import-mode=importlib", "--cov=batocera_battery_notifier", "--cov-branch", "--cov-report=term"]
strict = true
asyncio_mode = "auto"
