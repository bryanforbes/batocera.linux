[project]
name = "batocera-osd"
version = '44.0'
dependencies = [
    'batocera-common',
    'uvloop',
]

[project.scripts]
hotkeygen = "batocera_osd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "/batocera_osd",
]

[tool.pytest]
minversion = "9.0"
addopts = ["--import-mode=importlib", "--cov=batocera_osd", "--cov-branch", "--cov-report=term"]
strict = true
asyncio_mode = "auto"
